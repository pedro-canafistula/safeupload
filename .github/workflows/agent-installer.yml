name: Windows agent installer
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['agente/**', '.github/workflows/agent-installer.yml']
  push:
    branches: [main]
    paths: ['agente/**', '.github/workflows/agent-installer.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: agente
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Installer contracts in PowerShell 7 and Windows PowerShell 5.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/installer-tests -Force | Out-Null
          ./agente/installer/tests/Test-InstallerContracts.ps1 -ResultsPath artifacts/installer-tests/pwsh.json
          ./agente/installer/tests/Test-InstallerEnvironment.ps1 -ResultsPath artifacts/installer-tests/environment.json
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File agente/installer/tests/Test-InstallerContracts.ps1 -ResultsPath artifacts/installer-tests/ps51.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell installer contracts failed.' }
      - name: Build self-contained installer with verified compiler
        shell: pwsh
        run: |
          $compiler = ./agente/installer/Initialize-InnoCompiler.ps1
          ./agente/installer/Build-AgentInstaller.ps1 -CompilerPath $compiler
      - name: Verify package identity and payload before installation
        shell: pwsh
        run: |
          ./agente/installer/tests/Test-InstallerArtifact.ps1 -BuildResultPath artifacts/installer/build-result.json -ResultsPath artifacts/installer-tests/artifact-validation.json
      - name: Audit dispatch and queue contracts
        shell: pwsh
        run: |
          $env:SAFEUPLOAD_MACHINE_TESTS = '0'
          dotnet test agente/SafeUpload.Agent.Tests/SafeUpload.Agent.Tests.csproj -c Release --filter 'FullyQualifiedName~DispatcherReliabilityTests|FullyQualifiedName~AuditTrailTests|FullyQualifiedName~AuditQueueOverrideTests|FullyQualifiedName~QueueEncodingTests|FullyQualifiedName~InstallSafeUploadAgentScriptTests' --logger 'trx;LogFileName=audit-installer.trx' --results-directory artifacts/installer-tests
          if ($LASTEXITCODE -ne 0) { throw 'Audit dispatch contracts failed.' }
          dotnet build agente/SafeUpload.Agent.ContractSmoke/SafeUpload.Agent.ContractSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Service peer probe build failed.' }
      - name: Install and uninstall on the disposable Windows runner
        shell: pwsh
        run: |
          $build = Get-Content artifacts/installer/build-result.json -Raw | ConvertFrom-Json
          ./agente/installer/tests/Test-InstallerSmoke.ps1 -InstallerPath $build.installer
      - name: Installer and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeupload-agent-installer
          path: |
            artifacts/installer/*-setup.exe
            artifacts/installer/*.sha256
            artifacts/installer/build-result.json
            artifacts/installer/build-*/compiler.log
            artifacts/installer/build-*/publish-*.log
            artifacts/installer/build-*/payload/payload-manifest.json
            artifacts/installer-tests/
            artifacts/installer-smoke/

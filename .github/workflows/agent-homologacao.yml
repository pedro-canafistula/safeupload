name: Homologação do agente Windows

on:
  workflow_dispatch:
  push:
    branches: [tarefa/consolidar-base-agente-windows]
    paths:
      - 'agente/**'
      - '!agente/docs/**'
      - '!agente/**/README.md'
      - '.github/workflows/agent-homologacao.yml'

permissions:
  contents: read

jobs:
  componentes:
    name: Componentes C# ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Habilitar caminhos longos
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar diagnóstico isolado da fila
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          dotnet build agente/tools/QueueProbe/QueueProbe.csproj -c $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw 'O diagnostico de fila nao compilou.' }
      - name: Executar suíte C# completa sem filtro
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          New-Item -ItemType Directory -Path artifacts/csharp -Force | Out-Null
          whoami /all > artifacts/csharp/identity.txt
          dotnet test agente/SafeUpload.Agent.Tests/SafeUpload.Agent.Tests.csproj -c $env:BUILD_CONFIGURATION --logger 'trx;LogFileName=agente.trx' --results-directory artifacts/csharp *> artifacts/csharp/test.log
          $testExit = $LASTEXITCODE
          Get-Content artifacts/csharp/test.log -Tail 35
          if ($testExit -ne 0) { throw "A suíte C# completa falhou: $testExit. Preservar TRX e log." }
      - name: Interromper processos isolados de fila sintética
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          New-Item -ItemType Directory -Path artifacts/queue-crash -Force | Out-Null
          dotnet build agente/tools/QueueCrashProbe/QueueCrashProbe.csproj -c $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw 'O ensaio de interrupcao nao compilou.' }
          dotnet "agente/tools/QueueCrashProbe/bin/$env:BUILD_CONFIGURATION/net10.0/QueueCrashProbe.dll" artifacts/queue-crash 3 *> artifacts/queue-crash.log
          $probeExit = $LASTEXITCODE
          Get-Content artifacts/queue-crash.log -Tail 20
          if ($probeExit -ne 0) { throw 'Ensaio de interrupcao falhou; preservar recibos.' }
      - name: Preservar recibos de interrupção sem filas grandes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interrupcao-fila-${{ matrix.configuration }}
          path: |
            artifacts/queue-crash/**/result.json
            artifacts/queue-crash/**/failure.json
            artifacts/queue-crash.log
      - name: Interromper append com prefixo real e operação pendente
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          New-Item -ItemType Directory -Path artifacts/queue-append -Force | Out-Null
          dotnet build agente/tools/QueueAppendInterruptionProbe/QueueAppendInterruptionProbe.csproj -c $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw 'O ensaio de append nao compilou.' }
          dotnet "agente/tools/QueueAppendInterruptionProbe/bin/$env:BUILD_CONFIGURATION/net10.0/QueueAppendInterruptionProbe.dll" artifacts/queue-append 3 *> artifacts/queue-append.log
          $probeExit = $LASTEXITCODE
          Get-Content artifacts/queue-append.log -Tail 24
          if ($probeExit -ne 0) { throw 'Append sem cauda parcial comprovada ou recuperacao falhou.' }
      - name: Preservar recibos de append sem filas sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: append-interrompido-${{ matrix.configuration }}
          path: |
            artifacts/queue-append/**/result.json
            artifacts/queue-append/**/failure.json
            artifacts/queue-append.log
      - name: Preservar resultados completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-${{ matrix.configuration }}
          path: artifacts/csharp/

      - name: Cancelar varreduras reais em processos isolados
        shell: pwsh
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          New-Item -ItemType Directory -Path artifacts/queue-scan-cancel -Force | Out-Null
          dotnet build agente/tools/QueueScanCancellationProbe/QueueScanCancellationProbe.csproj -c $env:BUILD_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw 'O ensaio de cancelamento nao compilou.' }
          dotnet "agente/tools/QueueScanCancellationProbe/bin/$env:BUILD_CONFIGURATION/net10.0-windows/QueueScanCancellationProbe.dll" artifacts/queue-scan-cancel 3 *> artifacts/queue-scan-cancel.log
          $probeExit = $LASTEXITCODE
          Get-Content artifacts/queue-scan-cancel.log -Tail 20
          if ($probeExit -ne 0) { throw 'Cancelamento sem evidencia suficiente ou recuperacao falhou; preservar recibos.' }
      - name: Preservar recibos de cancelamento sem filas grandes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancelamento-varredura-${{ matrix.configuration }}
          path: |
            artifacts/queue-scan-cancel/**/result.json
            artifacts/queue-scan-cancel/**/failure.json
            artifacts/queue-scan-cancel.log

  instalacao:
    name: Instalação real em Windows descartável
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Habilitar caminhos longos
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Contratos PowerShell e ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/installer-tests -Force | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | ConvertTo-Json | Set-Content artifacts/installer-tests/os.json
          ./agente/installer/tests/Test-InstallerContracts.ps1 -ResultsPath artifacts/installer-tests/ps7.json
          ./agente/installer/tests/Test-InstallerEnvironment.ps1 -ResultsPath artifacts/installer-tests/environment.json
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File agente/installer/tests/Test-InstallerContracts.ps1 -ResultsPath artifacts/installer-tests/ps51.json
          if ($LASTEXITCODE -ne 0) { throw 'Os contratos Windows PowerShell 5.1 falharam.' }
          ./agente/scripts/tests/Test-M2DiagnosticsContracts.ps1 -ResultsPath artifacts/installer-tests/m2-ps7.json
          if ($LASTEXITCODE -ne 0) { throw 'Os contratos M2 PowerShell 7 falharam.' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -ExecutionPolicy Bypass -File agente/scripts/tests/Test-M2DiagnosticsContracts.ps1 -ResultsPath artifacts/installer-tests/m2-ps51.json
          if ($LASTEXITCODE -ne 0) { throw 'Os contratos M2 Windows PowerShell 5.1 falharam.' }
      - name: Gerar candidato 0.1.14 com compilador verificado
        shell: pwsh
        run: |
          $compiler = ./agente/installer/Initialize-InnoCompiler.ps1
          ./agente/installer/Build-AgentInstaller.ps1 -Version 0.1.14 -CompilerPath $compiler
      - name: Publicar ferramenta isolada e testar volume descartável cheio
        shell: pwsh
        run: |
          ./agente/tools/QueueFullVolumeProbe/Publish-Probe.ps1 -OutputDirectory artifacts/queue-full-tool
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File ./agente/scripts/Test-QueueFullVolume.ps1 -Context GitHubHosted -OutputParent artifacts/queue-full -ProbePath artifacts/queue-full-tool/publish/QueueFullVolumeProbe.exe -ManifestPath artifacts/queue-full-tool/probe-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Ensaio de volume cheio falhou no Windows PowerShell 5.1.' }
      - name: Preservar ferramenta e recibos de disco cheio sem imagem virtual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fila-volume-cheio
          path: |
            artifacts/queue-full-tool/
            artifacts/queue-full/**/wrapper-result.json
            artifacts/queue-full/**/probe-results/*.json
            artifacts/queue-full/**/*.log
            artifacts/queue-full/**/*.txt
      - name: Conferir o artefato antes da instalação
        shell: pwsh
        run: |
          ./agente/installer/tests/Test-InstallerArtifact.ps1 -BuildResultPath artifacts/installer/build-result.json -ResultsPath artifacts/installer-tests/artifact-validation.json
      - name: Instalar, inspecionar, reiniciar e desinstalar
        shell: pwsh
        run: |
          $build = Get-Content artifacts/installer/build-result.json -Raw | ConvertFrom-Json
          ./agente/installer/tests/Test-InstallerSmoke.ps1 -InstallerPath $build.installer
      - name: Preservar instalador e evidências inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-agente-instalador
          path: |
            artifacts/installer/*-setup.exe
            artifacts/installer/*.sha256
            artifacts/installer/build-result.json
            artifacts/installer/build-*/compiler.log
            artifacts/installer/build-*/publish-*.log
            artifacts/installer/build-*/payload/payload-manifest.json
            artifacts/installer-tests/
            artifacts/installer-smoke/

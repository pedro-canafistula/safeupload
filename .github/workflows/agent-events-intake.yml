name: Agent events intake
on:
  push:
    branches: [main, fix/agent-events-compat-20261020]
    paths:
      - 'web/back/**'
      - 'db/initdb/05_agent_audit_ingest.sql'
      - '.github/workflows/agent-events-intake.yml'
  pull_request:
    paths:
      - 'web/back/**'
      - 'db/initdb/05_agent_audit_ingest.sql'
      - '.github/workflows/agent-events-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-intake:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_DATABASE: app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: web/back/pom.xml
      - name: Contract with the actual MySQL DDL and existing controller mappings
        working-directory: web/back
        env:
          SAFEUPLOAD_AUDIT_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/app?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          SAFEUPLOAD_AUDIT_TEST_DB_USER: root
          SAFEUPLOAD_AUDIT_TEST_DB_PASSWORD: synthetic-ci-password
        run: mvn -B -Dtest=AgentEventsIntakeTest verify

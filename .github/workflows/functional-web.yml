name: Functional web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/front/package-lock.json
      - name: Backend tests and package
        run: mvn -B -f web/back/pom.xml clean package
      - name: Initialize the actual isolated MySQL schemas
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=synthetic-ci-password "$MYSQL_CONTAINER" mysql -uroot -e "SET GLOBAL time_zone='-03:00'; SET GLOBAL event_scheduler=OFF;"
          for ddl in 01_schema_acesso.sql 02_schema_app.sql 03_job_usuarios_inativos.sql 05_agent_audit_ingest.sql; do
            docker exec -i -e MYSQL_PWD=synthetic-ci-password "$MYSQL_CONTAINER" mysql -uroot < "db/initdb/$ddl"
          done
      - name: Frontend dependencies and build
        working-directory: web/front
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start isolated backend
        run: |
          java -Duser.timezone=America/Sao_Paulo -jar web/back/target/backend-0.1.0.jar \
            '--server.address=127.0.0.1' \
            '--app.datasource.url=jdbc:mysql://127.0.0.1:3306/app?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false' \
            '--app.datasource.username=root' '--app.datasource.password=synthetic-ci-password' \
            '--acesso.datasource.url=jdbc:mysql://127.0.0.1:3306/acesso?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false' \
            '--acesso.datasource.username=root' '--acesso.datasource.password=synthetic-ci-password' > backend-e2e.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/auth/decision > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend-e2e.log
          exit 1
      - name: Browser tests
        working-directory: web/front
        run: npm test
      - name: Test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics
          path: |
            backend-e2e.log
            web/back/target/surefire-reports/
            web/front/test-results/

  agent-contract:
    uses: ./.github/workflows/agent-host-identity-backend.yml
    with:
      contract-only: true

  installed-service:
    uses: ./.github/workflows/agent-host-identity-backend.yml
    with:
      contract-only: false

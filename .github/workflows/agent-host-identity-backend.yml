name: Contrato atual CSharp Ed25519 Java MySQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-backend-contract:
    name: Ed25519, política e offline (componentes; sem aceite SYSTEM/Drive)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            agente
            web/back
            db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: web/back/pom.xml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Empacotar backend inalterado e compilar ContractSmoke
        shell: pwsh
        run: |
          mvn -B -f web/back/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build agente/SafeUpload.Agent.ContractSmoke/SafeUpload.Agent.ContractSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar MySQL 8.4.13 oficial e conferir hash
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-8.4.13-winx64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mysql-agent-current'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.13-winx64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne 'E9CD98B1D23F122987B1AFCA26AD942EFEC5891481103D48AE3CDE237FA3EA54') { throw 'Unexpected MySQL archive hash.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
      - name: Validar contrato atual, publicação e recuperação em novos processos
        shell: pwsh
        run: |
          ./agente/scripts/Test-FunctionalAudit.ps1 -MySqlBasePath (Join-Path $env:RUNNER_TEMP 'mysql-agent-current/mysql-8.4.13-winx64') -OutputDirectory artifacts/agent-current/functional
      - name: Validar assinatura, tokens e offline com DDL original
        shell: pwsh
        run: |
          ./agente/scripts/Test-Ed25519Backend.ps1 -MySqlBasePath (Join-Path $env:RUNNER_TEMP 'mysql-agent-current/mysql-8.4.13-winx64') -BackendReferencePath $PWD -JavaPath (Join-Path $env:JAVA_HOME 'bin/java.exe') -OutputDirectory artifacts/agent-current/authentication
      - name: Preservar resultados, sem banco ou material de identidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-current-contract
          path: |
            artifacts/agent-current/functional/result.json
            artifacts/agent-current/functional/*.log
            artifacts/agent-current/authentication/result.json
            artifacts/agent-current/authentication/*.log
          if-no-files-found: warn

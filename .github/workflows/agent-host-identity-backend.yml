name: Identidade do serviço com Java e MySQL

on:
  workflow_call:
    inputs:
      contract-only:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-host-identity:
    name: ${{ inputs.contract-only && 'Contrato atual CSharp Java MySQL' || 'Serviço SYSTEM, reinício e backend real' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            agente
            web/back
            db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: web/back/pom.xml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Empacotar backend existente e publicar serviço
        shell: pwsh
        run: |
          mvn -B -f web/back/pom.xml -DskipTests package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar serviço para o aceite LocalSystem
        if: ${{ !inputs.contract-only }}
        shell: pwsh
        run: |
          dotnet publish agente/SafeUpload.Agent.Service/SafeUpload.Agent.Service.csproj -c Release -r win-x64 --self-contained true -o artifacts/host-identity-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build agente/SafeUpload.Agent.ContractSmoke/SafeUpload.Agent.ContractSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Executar suíte do agente e compilar contrato atual
        if: inputs.contract-only
        shell: pwsh
        env:
          SAFEUPLOAD_MACHINE_TESTS: '0'
        run: |
          New-Item -ItemType Directory -Path artifacts/host-identity-backend -Force | Out-Null
          dotnet test agente/SafeUpload.Agent.Tests/SafeUpload.Agent.Tests.csproj --verbosity minimal --logger 'trx;LogFileName=agent.trx' --results-directory artifacts/host-identity-backend *> artifacts/host-identity-backend/agent-tests.log
          $testExit = $LASTEXITCODE
          Get-Content artifacts/host-identity-backend/agent-tests.log -Tail 25
          if ($testExit -ne 0) { exit $testExit }
          dotnet build agente/SafeUpload.Agent.ContractSmoke/SafeUpload.Agent.ContractSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar MySQL 8.4.13 oficial e conferir hash
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql-8.4.13-winx64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mysql-host-identity'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.13-winx64.zip' -OutFile $zip
          $expected = 'E9CD98B1D23F122987B1AFCA26AD942EFEC5891481103D48AE3CDE237FA3EA54'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Unexpected MySQL archive hash.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
      - name: Validar identidade do serviço com banco e backend reais
        if: ${{ !inputs.contract-only }}
        shell: pwsh
        run: |
          ./agente/scripts/Test-HostIdentityBackend.ps1 -MySqlBase (Join-Path $env:RUNNER_TEMP 'mysql-host-identity/mysql-8.4.13-winx64') -ResultsDirectory artifacts/host-identity-backend
      - name: Validar contrato C# com banco e backend reais
        if: inputs.contract-only
        shell: pwsh
        run: |
          ./agente/scripts/Test-HostIdentityBackend.ps1 -MySqlBase (Join-Path $env:RUNNER_TEMP 'mysql-host-identity/mysql-8.4.13-winx64') -ResultsDirectory artifacts/host-identity-backend -ContractOnly
      - name: Preservar resultados sanitizados inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.contract-only && 'agent-current-contract' || 'host-identity-backend' }}
          path: artifacts/host-identity-backend/

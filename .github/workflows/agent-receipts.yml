name: Comunicação e recibos do agente

on:
  pull_request:
    branches: [main]
    paths:
      - 'agente/**'
      - '.github/workflows/agent-receipts.yml'
  push:
    branches: [main]
    paths:
      - 'agente/**'
      - '.github/workflows/agent-receipts.yml'

permissions:
  contents: read

jobs:
  receipt-regression:
    name: Recibos e cache (Release)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SAFEUPLOAD_MACHINE_TESTS: '0'
    steps:
      - name: Habilitar caminhos longos
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: agente
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar recibos e regressões relacionadas sem API ou serviço instalado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/agent-receipts -Force | Out-Null
          dotnet test agente/SafeUpload.Agent.Tests/SafeUpload.Agent.Tests.csproj -c Release --filter 'FullyQualifiedName~AuditQueueTemporaryTests|FullyQualifiedName~QueueTemporaryClassificationTests|FullyQualifiedName~AuditQueueRetentionPreviewTests|FullyQualifiedName~AuditHistoryTests|FullyQualifiedName~FileQuarantineTests|FullyQualifiedName~AuditQueueHealthTests|FullyQualifiedName~AuditQueueIntegrityTests|FullyQualifiedName~AuditQueueDiagnosticConcurrencyTests|FullyQualifiedName~QueueStreamingConfirmationTests|FullyQualifiedName~QueueBoundedReadTests|FullyQualifiedName~AgentAuditDispatchTests|FullyQualifiedName~AgentApiClientTests|FullyQualifiedName~DispatcherReliabilityTests|FullyQualifiedName~DurableHttpPolicyStoreTests|FullyQualifiedName~RefreshingPolicyStoreTests|FullyQualifiedName~AgentApiCommunicationTests|FullyQualifiedName~CommunicationHealthTests|FullyQualifiedName~CommunicationLoggingTests|FullyQualifiedName~MinifilterPolicyBridgeTests|FullyQualifiedName~AdministrationConfigurationTests|FullyQualifiedName~RegisteredHostIdentityTests|FullyQualifiedName~CommunicationPresentationTests|FullyQualifiedName~NotificationProtocolTests|FullyQualifiedName~NotificationHubTests|FullyQualifiedName~NotificationRecordTests' --logger 'trx;LogFileName=receipts.trx' --results-directory artifacts/agent-receipts *> artifacts/agent-receipts/test.log
          $testExit = $LASTEXITCODE
          Get-Content artifacts/agent-receipts/test.log -Tail 30
          if ($testExit -ne 0) { throw 'Falha no recorte do agente; preservar TRX e log.' }
          [xml]$trx = Get-Content artifacts/agent-receipts/receipts.trx -Raw
          $receipts = @($trx.SelectNodes("//*[local-name()='UnitTestResult']") | Where-Object { $_.GetAttribute('testName').Contains('DispatcherReliabilityTests.') })
          if ($receipts.Count -lt 23 -or @($receipts | Where-Object { $_.GetAttribute('outcome') -ne 'Passed' }).Count -ne 0) {
            throw 'Casos de recibo ausentes, ignorados ou não aprovados.'
          }
          $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          foreach ($group in @('AuditQueueTemporaryTests', 'QueueTemporaryClassificationTests', 'AuditQueueRetentionPreviewTests', 'AuditHistoryTests', 'FileQuarantineTests', 'AuditQueueHealthTests', 'AuditQueueIntegrityTests', 'AuditQueueDiagnosticConcurrencyTests', 'QueueStreamingConfirmationTests', 'QueueBoundedReadTests', 'AgentAuditDispatchTests', 'AgentApiClientTests', 'DispatcherReliabilityTests', 'DurableHttpPolicyStoreTests', 'RefreshingPolicyStoreTests', 'AgentApiCommunicationTests', 'CommunicationHealthTests', 'CommunicationLoggingTests', 'MinifilterPolicyBridgeTests', 'AdministrationConfigurationTests', 'RegisteredHostIdentityTests', 'CommunicationPresentationTests', 'NotificationProtocolTests', 'NotificationHubTests', 'NotificationRecordTests')) {
            $cases = @($results | Where-Object { $_.GetAttribute('testName').Contains("$group.") })
            if ($cases.Count -eq 0 -or @($cases | Where-Object { $_.GetAttribute('outcome') -ne 'Passed' }).Count -ne 0) {
              throw "Grupo ausente, ignorado ou reprovado: $group"
            }
          }
      - name: Validar identidade protegida em dois processos SYSTEM
        shell: pwsh
        run: ./agente/scripts/Test-HostIdentitySystem.ps1 -ResultsDirectory artifacts/agent-receipts
      - name: Compilar interface e ferramentas de ensaio
        shell: pwsh
        run: |
          dotnet build agente/SafeUpload.Agent.App/SafeUpload.Agent.App.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish agente/SafeUpload.Agent.ApiSmoke/SafeUpload.Agent.ApiSmoke.csproj -c Release -r win-x64 --self-contained true -o artifacts/api-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish agente/SafeUpload.Agent.IntegrationSmoke/SafeUpload.Agent.IntegrationSmoke.csproj -c Release -r win-x64 --self-contained true -o artifacts/integration-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercitar HTTP sintético pelas ferramentas publicadas
        shell: pwsh
        run: |
          python agente/scripts/Test-AgentApiSmoke.py --executable artifacts/api-smoke/SafeUpload.Agent.ApiSmoke.exe *> artifacts/agent-receipts/api-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python agente/scripts/Test-AgentIntegrationSmoke.py --executable artifacts/integration-smoke/SafeUpload.Agent.IntegrationSmoke.exe *> artifacts/agent-receipts/integration-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preservar evidências inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-receipts-release
          path: artifacts/agent-receipts/
          if-no-files-found: error

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: safeupload-db 
    secrets:
      - mysql_senha_root
      - mysql_senha_app
    ports: 
      - "3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql

volumes:
  mysql_dados:

secrets:
  mysql_senha_root:
    file: ./secrets/MYSQL_SENHA_ROOT.txt
  mysql_senha_app:
    file: ./secrets/MYSQL_SENHA_APP.txt

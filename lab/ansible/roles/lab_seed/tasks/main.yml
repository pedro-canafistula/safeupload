# First-boot seed: the image is generic; each lab VM gets its hostname, password, SSH keys and trusted test
# certificate from the seed disk that Terraform attaches (see files/lab-seed.ps1).
- name: Seed script directory (SYSTEM and Administrators only)
  ansible.windows.win_shell: |
    $d = 'C:\ProgramData\SafeUploadLab'
    New-Item -ItemType Directory -Force -Path $d | Out-Null
    & icacls.exe $d /inheritance:r /grant 'SYSTEM:(OI)(CI)F' /grant '*S-1-5-32-544:(OI)(CI)F' | Out-Null
  args:
    executable: powershell

- name: Install the seed script
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "C:\\ProgramData\\SafeUploadLab\\{{ item }}"
  loop:
    - lab-seed.ps1
    - Prepare-Oobe.ps1
    - New-OobeAnswer.ps1
    - Complete-Oobe.ps1

- name: Run the seed at every startup as SYSTEM
  ansible.windows.win_shell: |
    $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\SafeUploadLab\lab-seed.ps1'
    $trigger = New-ScheduledTaskTrigger -AtStartup
    $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
    $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 10) -StartWhenAvailable
    Register-ScheduledTask -TaskName 'SafeUploadLabSeed' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
  args:
    executable: powershell

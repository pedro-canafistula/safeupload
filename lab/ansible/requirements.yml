# Install with: ansible-galaxy collection install -r requirements.yml -p ./collections
# Exact resolved versions are recorded in ../versions.md after install. Windows over SSH needs ansible-core >= 2.18 (see ../README.md for the pinned controller version).
collections:
  - name: ansible.windows
    version: ">=2.5.0,<3.0.0"
  - name: community.windows
    version: ">=2.3.0,<3.0.0"

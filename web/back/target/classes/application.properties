spring.application.name=safeupload-backend
server.port=8080

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA.
# Em produção isso deve virar "validate" + migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Sessão HTTP (cookie JSESSIONID) usada para manter o login
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


spring.datasource.url=jdbc:mysql://localhost:3306/acesso?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
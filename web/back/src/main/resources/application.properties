spring.application.name=safeupload-backend
server.port=8080
server.address=${SAFEUPLOAD_BIND_ADDRESS:127.0.0.1}

# --- Banco H2 em arquivo (fica salvo em back/data/safeupload.mv.db) ---
spring.datasource.url=jdbc:h2:file:./data/safeupload;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA.
# Em produção isso deve virar "validate" + migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, útil para inspecionar o banco no navegador
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Sessão HTTP (cookie JSESSIONID) usada para manter o login
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true

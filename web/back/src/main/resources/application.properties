spring.application.name=safeupload-backend
server.port=8080

# --- Banco H2 em arquivo (fica salvo em back/data/safeupload.mv.db) ---
# Troca para Postgres/MySQL/SQLite depois: só mudar estas 4 linhas.
spring.datasource.url=jdbc:h2:file:./data/safeupload;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA.
# Em produção isso deve virar "validate" + migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2, útil para inspecionar o banco no navegador
# (acesse http://localhost:8080/h2-console depois de rodar a aplicação)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sessão HTTP (cookie JSESSIONID) usada para manter o login
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

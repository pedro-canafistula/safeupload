spring.application.name=safeupload-backend
server.port=8080
server.address=${SAFEUPLOAD_BIND_ADDRESS:127.0.0.1}

# Sessão HTTP (cookie JSESSIONID) usada para manter o login
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Banco de dados (container safeupload-db). As credenciais ficam nas variáveis de ambiente.
spring.datasource.url=${SAFEUPLOAD_DB_URL:jdbc:mysql://127.0.0.1:3306/safeupload?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SAFEUPLOAD_DB_USERNAME:safeupload}
spring.datasource.password=${SAFEUPLOAD_DB_PASSWORD}

# O schema vem de db/initdb/*.sql, então o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O contrato do agente exige nomes textuais para enums; índices numéricos são inválidos.
spring.jackson.deserialization.fail-on-numbers-for-enums=true

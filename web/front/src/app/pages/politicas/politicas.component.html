<header class="page-title"><h1>Políticas</h1></header><section class="surface"><div class="heading"><h2>Políticas ativas</h2><button>Nova política</button></div><div class="table-wrap"><table><thead><tr><th>Ativa</th><th>Política</th><th>Canais</th><th>Ação</th><th>Ocorrências (7d)</th></tr></thead><tbody><tr *ngFor="let policy of policies"><td><span class="active-dot">●</span></td><td><strong>{{ policy.name }}</strong><small>{{ policy.description }}</small></td><td>{{ policy.channels }}</td><td><span class="tag">{{ policy.action }}</span></td><td>{{ policy.occurrences }}</td></tr></tbody></table></div></section>

<section class="auth-page">
  <div class="auth-box card">
    <h1>SafeUpload</h1>
    <p>Criar conta</p>

    <div class="msg erro" *ngIf="erro">{{ erro }}</div>

    <form (ngSubmit)="enviar()">
      <label for="nomeCompleto">Nome completo</label>
      <input id="nomeCompleto" name="nomeCompleto" [(ngModel)]="nomeCompleto" autocomplete="name" required />

      <label for="username">Nome de usuário</label>
      <input id="username" name="username" [(ngModel)]="username" autocomplete="username" required />

      <label for="email">E-mail</label>
      <input id="email" name="email" [(ngModel)]="email" type="email" autocomplete="email" required />

      <label for="cpf">CPF</label>
      <input id="cpf" name="cpf" [(ngModel)]="cpf" required />

      <label for="dataNascimento">Data de nascimento</label>
      <input id="dataNascimento" name="dataNascimento" [(ngModel)]="dataNascimento" type="date" />

      <label for="senha">Senha</label>
      <input id="senha" name="senha" [(ngModel)]="senha" type="password" autocomplete="new-password" required minlength="8" />

      <label for="confirmarSenha">Confirmar senha</label>
      <input id="confirmarSenha" name="confirmarSenha" [(ngModel)]="confirmarSenha" type="password" autocomplete="new-password" required />

      <button class="btn-primary" [disabled]="carregando" type="submit">Criar conta</button>
    </form>

    <a routerLink="/login">Voltar para login</a>
  </div>
</section>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/painel" aria-label="SafeUpload, ir para o painel">
      <span class="brand-mark">◇</span><span class="brand-name">SafeUpload<small>ADMIN CONSOLE</small></span>
    </a>
    <nav aria-label="Navegação principal">
      <span class="nav-caption">PAINEL</span>
      <a *ngFor="let item of menu" [routerLink]="item.rota" routerLinkActive="active" [attr.aria-label]="item.titulo"><span class="nav-icon" aria-hidden="true">{{ item.icone }}</span>{{ item.titulo }}</a>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="breadcrumb"><span>Console administrativo</span><b>/</b><strong>{{ paginaAtual }}</strong></div>
      <div class="topbar-user"><span class="team-name">{{ auth.usuarioLogado?.nomeCompleto || 'Administrador' }}</span><span class="user-avatar">{{ (auth.usuarioLogado?.nomeCompleto || 'SU').slice(0, 2).toUpperCase() }}</span><button type="button" class="logout" (click)="sair()" aria-label="Sair">↗</button></div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>

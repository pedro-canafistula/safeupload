<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/painel" aria-label="Safeupload, ir para o painel">
      <span class="brand-mark">S</span><span>Safeupload</span>
    </a>
    <nav>
      <a *ngFor="let item of menu" [routerLink]="item.rota" routerLinkActive="active">{{ item.titulo }}</a>
    </nav>
    <div class="sidebar-account">
      <span>Conta</span>
      <strong>{{ auth.usuarioLogado?.nomeCompleto || 'Administrador' }}</strong>
      <button type="button" (click)="sair()">Sair</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
